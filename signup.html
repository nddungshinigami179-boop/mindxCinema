<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="div_container">
        <h1>Tạo tài khoản</h1>
        <div class="content">
            <div class="form-box">
                <form id="profileForm">
                    <label for="email">Email</label>
                    <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
                    />
                    <label for="name">Tên</label>
                    <input
                    type="text"
                    id="name"
                    placeholder="Nhập tên của bạn"
                    required
                    />
                    <label for="pw">Mật khẩu</label>
                    <input
                    type="text"
                    id="pw"
                    placeholder="Đặt mật khẩu"
                    required
                    />
                    <button type="submit" id="saveBtn">Lưu hồ sơ</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
